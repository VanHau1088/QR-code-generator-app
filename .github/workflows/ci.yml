name: CI with Yarn

on:
  push:
    branches: [ "main" ]  # Thay "main" bằng nhánh chính của bạn nếu khác
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Hoặc phiên bản Node.js bạn đang dùng

      - name: Install dependencies (Yarn)
        run: yarn install

      - name: Run linters
        run: yarn lint # hoặc lệnh lint của bạn

      - name: Run tests (Yarn)
        run: yarn test  # Thay thế bằng lệnh test của bạn, ví dụ: `yarn run test:unit`
