name: CI with Yarn

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Check Git repository
        run: git fsck --full --strict

      - name: Clean install
        run: |
          rm -rf node_modules
          yarn cache clean
          yarn install --force

      - name: Install dependencies (Yarn)
        run: yarn install

      - name: Run linters
        run: yarn lint # hoặc lệnh lint của bạn

      - name: Run tests (Yarn)
        run: yarn test  # Thay thế bằng lệnh test của bạn, ví dụ: `yarn run test:unit`

      - name: Build
        run: yarn build
